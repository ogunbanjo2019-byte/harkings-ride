<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SwitchRide Admin Back-office</title>
  <style>
    :root {
      --navy: #071a2b;
      --navy2: #0d2c45;
      --green: #1aa477;
      --bg: #f4f7f8;
      --muted: #6b7b88;
      --border: #dce5e9;
      --red: #cf4c57;
      --amber: #c88a18;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: #173043;
      background: var(--bg);
    }

    button, input {
      font: inherit;
    }

    .shell {
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--navy);
      color: white;
      padding: 24px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      margin: 4px 10px 30px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--navy);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-weight: 900;
    }

    .nav {
      display: grid;
      gap: 5px;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: #c8d7df;
      text-align: left;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--navy2);
      color: #fff;
    }

    .main {
      padding: 26px 30px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top h1 {
      margin: 0;
      font-size: 26px;
      color: var(--navy);
    }

    .top p {
      color: var(--muted);
      margin: 5px 0;
    }

    .userbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 30px;
      background: #e6f5ef;
      color: #117753;
      font-weight: 700;
    }

    .logout, .primary {
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .logout {
      background: #e7edf0;
      color: #294658;
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .card, .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 12px #1730430a;
    }

    .card {
      padding: 17px;
    }

    .card small {
      color: var(--muted);
    }

    .card strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
      color: var(--navy);
    }

    .panel {
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel h2 {
      font-size: 17px;
      margin: 0 0 14px;
      color: var(--navy);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 650px;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .tag {
      display: inline-block;
      border-radius: 30px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #eaf0f3;
    }

    .tag.ok {
      background: #e5f6ee;
      color: #10744e;
    }

    .tag.warn {
      background: #fff3d9;
      color: #96600a;
    }

    .tag.danger {
      background: #ffe7e8;
      color: #aa2735;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .actions button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
    }

    .actions button:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .map {
      min-height: 270px;
      border-radius: 10px;
      background: radial-gradient(circle at 30% 30%, #d3efe8 0 4%, transparent 5%), linear-gradient(135deg, #e8f3f2, #c9dfe1);
      position: relative;
      overflow: hidden;
    }

    .map:after {
      content: 'Live driver and trip locations';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #4a6b72;
      font-weight: 700;
    }

    .dot {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--green);
      border: 3px solid white;
      box-shadow: 0 2px 5px #0004;
      border-radius: 50%;
      z-index: 1;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }

    #login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--navy), #0c4259);
    }

    .login-card {
      background: white;
      width: min(410px, 92vw);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 18px 60px #0004;
    }

    .login-card h1 {
      margin: 0 0 7px;
      color: var(--navy);
    }

    .login-card p {
      color: var(--muted);
      margin-top: 0;
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 15px 0;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: #526976;
    }

    .field input {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 11px;
    }

    .login-card button {
      width: 100%;
      margin-top: 8px;
    }

    .error {
      color: var(--red);
      min-height: 20px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 850px) {
      .shell {
        grid-template-columns: 1fr;
      }
      .sidebar {
        padding: 12px;
      }
      .brand {
        margin-bottom: 12px;
      }
      .nav {
        display: flex;
        overflow: auto;
      }
      .nav button {
        white-space: nowrap;
      }
      .main {
        padding: 18px;
      }
      .grid2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="login">
    <form class="login-card" id="loginForm">
      <div class="brand"><span class="brand-mark">S</span> SWITCHRIDE</div>
      <h1>Admin back-office</h1>
      <p>Sign in with an admin account to continue.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required>
      </div>
      <button class="primary" type="submit">Sign in</button>
      <div class="error" id="loginError"></div>
    </form>
  </section>

  <section id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">S</span> SWITCHRIDE</div>
      <nav class="nav">
        <button data-view="overview" class="active">Executive overview</button>
        <button data-view="verification">Driver clearance</button>
        <button data-view="sos">SOS / Emergency</button>
        <button data-view="payouts">Wallet payouts</button>
        <button data-view="radar">Trip dispatch radar</button>
        <button data-view="cng">CNG analytics</button>
        <button data-view="audit">Audit & exports</button>
        <button data-view="pricing">Fare pricing</button>
      </nav>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="title">Executive overview</h1>
          <p id="subtitle">Live operations monitor</p>
        </div>
        <div class="userbar">
          <span class="pill">Admin</span>
          <button class="logout" id="logout">Log out</button>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </section>

  <script>
    const API = '/api/v1';
    let token = localStorage.getItem('adminToken');
    const $ = id => document.getElementById(id);

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          ...(options.headers || {})
        }
      });
      const body = await res.json();
      if (!res.ok || !body.success) {
        throw Error(body.message || body.error?.code || 'Request failed');
      }
      return body.data;
    }

    async function downloadExport(resource) {
      const res = await fetch(API + '/admin/exports/' + resource, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) throw Error('Export failed');
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = resource + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function showApp() {
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      loadView('overview');
    }

    function showLogin() {
      $('app').classList.add('hidden');
      $('login').classList.remove('hidden');
    }

    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      $('loginError').textContent = '';
      try {
        const d = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: $('email').value, password: $('password').value })
        });
        if (d.user.role !== 'admin') throw Error('This account is not an admin');
        token = d.accessToken;
        localStorage.setItem('adminToken', token);
        showApp();
      } catch (err) {
        $('loginError').textContent = err.message;
      }
    };

    $('logout').onclick = () => {
      localStorage.removeItem('adminToken');
      token = null;
      showLogin();
    };

    document.querySelectorAll('.nav button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        loadView(b.dataset.view);
      };
    });

    const tag = s => '<span class="tag ' + (s === 'approved' || s === 'paid' || s === 'resolved' ? 'ok' : s === 'rejected' || s === 'false_alarm' ? 'danger' : 'warn') + '">' + esc(s || 'pending') + '</span>';

    async function loadView(view) {
      const titles = {
        overview: ['Executive overview', 'Live operations monitor'],
        verification: ['Driver clearance queue', 'Identity and document review'],
        sos: ['SOS / Emergency desk', 'Safety alerts and response tracking'],
        payouts: ['Wallet payout audit', 'Review and settle withdrawal requests'],
        radar: ['Trip dispatch radar', 'Current driver and ride locations'],
        cng: ['CNG operations', 'Refueling volume and partner-station data'],
        audit: ['Audit & exports', 'Operational history and downloadable records'],
        pricing: ['Fare pricing', 'Edit the tariff used for new ride requests']
      };
      
      $('title').textContent = titles[view][0];
      $('subtitle').textContent = titles[view][1];

      try {
        if (view === 'overview') await overview();
        if (view === 'verification') await verification();
        if (view === 'sos') await sos();
        if (view === 'payouts') await payouts();
        if (view === 'radar') await radar();
        if (view === 'cng') await cng();
        if (view === 'audit') await auditView();
        if (view === 'pricing') await pricingView();
      } catch (e) {
        $('content').innerHTML = '<div class="panel"><div class="error">' + esc(e.message) + '</div></div>';
      }
    }

    function cards(d) {
      const names = [
        ['users', 'Users'],
        ['drivers', 'Drivers'],
        ['activeDrivers', 'Online drivers'],
        ['rides', 'Trips'],
        ['pendingDrivers', 'Pending drivers'],
        ['openSos', 'Open SOS'],
        ['pendingWithdrawals', 'Pending payouts'],
        ['totalRevenue', 'Revenue (NGN)']
      ];
      return '<div class="cards">' + names.map(([k, n]) => '<div class="card"><small>' + n + '</small><strong>' + (typeof d[k] === 'number' ? d[k].toLocaleString() : 0) + '</strong></div>').join('') + '</div>';
    }

    async function overview() {
      const d = await api('/admin/dashboard');
      $('content').innerHTML = cards(d) + '<div class="grid2"><div class="panel">2 Operational readiness</h2><p>Pending verification documents: <b>' + d.pendingDocuments + '</b></p><p>Active subscriptions: <b>' + d.activeSubscriptions + '</b></p><p>Completed trips: <b>' + d.completedRides + '</b></p><p>Total payouts: <b>₦' + Number(d.totalPayouts || 0).toLocaleString() + '</b></p></div><div class="panel"><h2>Quick actions</h2><div class="actions"><button onclick="loadView(\'verification\')">Open clearance queue</button><button onclick="loadView(\'sos\')">Open SOS desk</button><button onclick="loadView(\'payouts\')">Review payouts</button><button onclick="loadView(\'audit\')">View audit log</button></div></div></div>';
    }

    async function verification() {
      const d = await api('/admin/verification/queue?limit=100');
      const rows = d.items || [];
      $('content').innerHTML = '<div class="panel"><h2>Driver verification queue (' + (d.total || 0) + ')</h2><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Contact</th><th>Status</th><th>Documents</th><th>Identity</th><th>Actions</th></tr></thead><tbody>' + (rows.map(x => {
        const dr = x.driver;
        return '<tr><td><b>' + esc(dr.user?.name || 'Unknown') + '</b><br><small>' + esc(dr.id) + '</small></td><td>' + esc(dr.user?.phone || dr.user?.email || '') + '</td><td>' + tag(dr.verificationStatus) + '</td><td>' + x.documents.length + ' file(s)</td><td>' + (x.identity ? tag(x.identity.nin?.status || x.identity.selfie?.status || 'pending') : 'Not submitted') + '</td><td class="actions"><button onclick="review(\'' + dr.id + '\',\'approved\')">Approve</button><button onclick="review(\'' + dr.id + '\',\'rejected\')">Reject</button></td></tr>';
      }).join('') || '<tr><td colspan="6" class="empty">Queue is clear</td></tr>') + '</tbody></table></div></div>';
    }

    async function review(id, status) {
      await api('/admin/drivers/' + id + '/verification-review', {
        method: 'PUT',
        body: JSON.stringify({ status })
      });
      loadView('verification');
    }

    async function sos() {
      const d = await api('/admin/sos?limit=100');
      $('content').innerHTML = '<div class="panel"><h2>Emergency alerts (' + (d.total || 0) + ')</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Trip</th><th>Coordinates</th><th>Status</th><th>Note</th><th>Actions</th></tr></thead><tbody>' + ((d.items || []).map(x => '<tr><td>' + new Date(x.createdAt).toLocaleString() + '</td><td>' + esc(x.tripId) + '</td><td>' + x.latitude + ', ' + x.longitude + '</td><td>' + tag(x.status) + '</td><td>' + esc(x.note || '') + '</td><td class="actions"><button onclick="sosUpdate(\'' + x.id + '\',\'acknowledged\')">Acknowledge</button><button onclick="sosUpdate(\'' + x.id + '\',\'dispatched\')">Dispatch</button><button onclick="sosUpdate(\'' + x.id + '\',\'resolved\')">Resolve</button></td></tr>').join('') || '<tr><td colspan="6" class="empty">No SOS alerts</td></tr>') + '</tbody></table></div></div>';
    }

    async function sosUpdate(id, status) {
      await api('/admin/sos/' + id, {
        method: 'PUT',
        body: JSON.stringify({ status })
      });
      loadView('sos');
    }

    async function payouts() {
      const d = await api('/admin/wallet/withdrawals?limit=100');
      $('content').innerHTML = '<div class="panel"><h2>Withdrawal requests (' + (d.total || 0) + ')</h2><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Amount</th><th>Bank</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + ((d.items || []).map(x => '<tr><td>' + esc(x.driver?.user?.name || 'Unknown') + '</td><td>₦' + Number(x.amount || 0).toLocaleString() + '</td><td>' + esc(x.bankAccount?.accountNumber || '') + '</td><td>' + tag(x.status) + '</td><td class="actions"><button onclick="payout(\'' + x.id + '\',\'approved\')">Approve</button><button onclick="payout(\'' + x.id + '\',\'paid\')">Mark paid</button><button onclick="payout(\'' + x.id + '\',\'rejected\')">Reject</button></td></tr>').join('') || '<tr><td colspan="5" class="empty">No withdrawal requests</td></tr>') + '</tbody></table></div></div>';
    }

    async function payout(id, status) {
      await api('/admin/wallet/withdrawals/' + id, {
        method: 'PUT',
        body: JSON.stringify({ status })
      });
      loadView('payouts');
    }

    async function radar() {
      const d = await api('/admin/dispatch/radar');
      $('content').innerHTML = '<div class="panel"><h2>Live operations map</h2><div class="map">' + d.drivers.map((x, i) => '<span class="dot" title="' + esc(x.name || x.driverId) + '" style="left:' + (12 + (i * 17) % 82) + '%;top:' + (18 + (i * 29) % 68) + '%"></span>').join('') + '</div></div><div class="panel"><h2>Open trips (' + d.rides.length + ')</h2><div class="table-wrap"><table><thead><tr><th>Trip</th><th>Status</th><th>Driver</th><th>Requested</th></tr></thead><tbody>' + (d.rides.map(x => '<tr><td>' + esc(x.id) + '</td><td>' + tag(x.status) + '</td><td>' + esc(x.driverId || 'Unassigned') + '</td><td>' + new Date(x.createdAt).toLocaleString() + '</td></tr>').join('') || '<tr><td colspan="4" class="empty">No open trips</td></tr>') + '</tbody></table></div></div>';
    }

    async function cng() {
      const d = await api('/admin/cng/summary');
      $('content').innerHTML = cards({
        totalRefuels: d.totalRefuels,
        totalQuantity: d.totalQuantity,
        totalAmount: d.totalAmount
      }) + '<div class="panel"><h2>Partner station summary</h2><div class="table-wrap"><table><thead><tr><th>Station</th><th>Refuels</th><th>Quantity</th><th>Amount</th></tr></thead><tbody>' + ((d.byStation || []).map(x => '<tr><td>' + esc(x.station) + '</td><td>' + x.refuels + '</td><td>' + x.quantity + '</td><td>₦' + Number(x.amount).toLocaleString() + '</td></tr>').join('') || '<tr><td colspan="4" class="empty">No CNG logs</td></tr>') + '</tbody></table></div></div>';
    }

    async function auditView() {
      const d = await api('/admin/audit-logs?limit=100');
      $('content').innerHTML = '<div class="panel"><h2>Audit log</h2><p class="actions"><button onclick="downloadExport(\'audit\')">Download CSV</button><button onclick="downloadExport(\'drivers\')">Export drivers</button><button onclick="downloadExport(\'withdrawals\')">Export payouts</button></p><div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Resource</th><th>Actor</th><th>Metadata</th></tr></thead><tbody>' + ((d.items || []).map(x => '<tr><td>' + new Date(x.createdAt).toLocaleString() + '</td><td>' + tag(x.action) + '</td><td>' + esc(x.resource) + '</td><td>' + esc(x.actorId) + '</td><td><small>' + esc(JSON.stringify(x.metadata || {})) + '</small></td></tr>').join('') || '<tr><td colspan="5" class="empty">No audit records</td></tr>') + '</tbody></table></div></div>';
    }

    async function pricingView() {
      const d = await api('/admin/pricing');
      const p = d.pricing;
      $('content').innerHTML = '<div class="panel"><h2>Ride tariff (NGN)</h2><p>Changes apply only to new rides. Existing ride prices remain locked.</p>' + (p.isBootstrapDefault ? '<p class="tag warn">Using placeholder tariff. Confirm the real rates before production.</p>' : '') + '<div class="grid2"><label>Base fare<input id="pbase" type="number" min="0" step="1" value="' + p.baseFare + '"></label><label>Per km<input id="pkm" type="number" min="0" step="1" value="' + p.perKm + '"></label><label>Per minute<input id="pmin" type="number" min="0" step="1" value="' + p.perMinute + '"></label><label>Minimum fare<input id="pminimum" type="number" min="0" step="1" value="' + p.minimumFare + '"></label><label>Cash surcharge<input id="pcash" type="number" min="0" step="1" value="' + p.cashSurcharge + '"></label><label>Night surcharge<input id="pnight" type="number" min="0" step="1" value="' + (p.nightSurcharge || 0) + '"></label></div><p><button class="primary" onclick="savePricing()">Save tariff</button> <span id="pricingMessage"></span></p></div><div class="panel"><h2>Recent tariff audit entries</h2><pre>' + esc(JSON.stringify(d.audit || [], null, 2)) + '</pre></div>';
    }

    async function savePricing() {
      try {
        await api('/admin/pricing', {
          method: 'PUT',
          body: JSON.stringify({
            baseFare: Number($('pbase').value),
            perKm: Number($('pkm').value),
            perMinute: Number($('pmin').value),
            minimumFare: Number($('pminimum').value),
            cashSurcharge: Number($('pcash').value),
            nightSurcharge: Number($('pnight').value)
          })
        });
        $('pricingMessage').textContent = 'Saved';
        pricingView();
      } catch (e) {
        $('pricingMessage').textContent = e.message;
      }
    }

    if (token) showApp();
  </script>
</body>
</html>
