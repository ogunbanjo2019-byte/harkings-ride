<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset SwitchRide password</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #071a2b;
      font: 15px system-ui;
      color: #173043;
    }

    .card {
      background: #fff;
      width: min(420px, 90vw);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 20px 60px #0005;
    }

    h1 {
      margin-top: 0;
      color: #071a2b;
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 16px 0;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: #647783;
    }

    input {
      padding: 12px;
      border: 1px solid #dce5e9;
      border-radius: 7px;
    }

    .button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      background: #1aa477;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
    }

    .error {
      color: #b52e3e;
    }

    .ok {
      color: #10744e;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Choose a new SwitchRide password.</p>
    
    <form id="form">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" minlength="8" required>
      </div>

      <button type="submit" class="button">Reset password</button>
      <div id="message" class="message"></div>
    </form>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');

    form.onsubmit = async (e) => {
      e.preventDefault();
      message.className = 'message';

      if (!token) {
        message.textContent = 'This reset link is missing or invalid.';
        message.classList.add('error');
        return;
      }

      if (passwordInput.value !== confirmInput.value) {
        message.textContent = 'Passwords do not match.';
        message.classList.add('error');
        return;
      }

      try {
        const response = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token: token,
            password: passwordInput.value
          })
        });

        const body = await response.json();

        if (!response.ok || !body.success) {
          throw new Error(body.message || 'Reset failed');
        }

        message.textContent = 'Password reset successfully. You can now return to the app and sign in.';
        message.classList.add('ok');
        form.reset();
      } catch (error) {
        message.textContent = error.message;
        message.classList.add('error');
      }
    };
  </script>
</body>
</html>
